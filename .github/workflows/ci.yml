name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find core browser desktop -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
      - name: Build browser release
        run: ./build.sh
      - name: Verify browser archive
        run: unzip -t dist/zahl-tamagotchi-web.zip
